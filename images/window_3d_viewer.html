<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #080808; display: flex; align-items: center; justify-content: center; min-height: 400px; font-family: 'DM Sans', sans-serif; }
.viewer-wrap {
  width: 100%;
  max-width: 600px;
  background: #080808;
  border-radius: 16px;
  overflow: hidden;
  padding: 20px;
  text-align: center;
}
model-viewer {
  width: 100%;
  height: 400px;
  background: transparent;
  --progress-bar-color: #c9a96e;
}
.label {
  color: #c9a96e;
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 12px;
  opacity: 0.7;
}
</style>
</head>
<body>
<div class="viewer-wrap">
  <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="3D Window Profile"
    auto-rotate
    camera-controls
    rotation-per-second="30deg"
    style="width:100%;height:400px;background:transparent"
  ></model-viewer>
  <div class="label">↻ Крути мышкой • Auto-rotate включён</div>
</div>
</body>
</html>
